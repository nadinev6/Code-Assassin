[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "code-assassin"
version = "0.1.0"
description = "Terminal voice-driven coding assistant powered by local Qwen 2.5 Coder 3B and Piper TTS."
requires-python = ">=3.11"
dependencies = [
    "typer>=0.12",
    "rich>=13.0",
    "prompt-toolkit>=3.0",
    "httpx>=0.27",
    "sounddevice>=0.4",
    "numpy>=1.24",
    "piper-tts>=1.1",
]

[project.optional-dependencies]
   dev = [
       "pytest>=8.0",
       "pytest-cov>=5.0",
       "ruff>=0.8",
       "pytest-asyncio>=0.21",  # For async test support
   ]
   voice = [
       "piper-tts>=1.1",
   ]

[project.scripts]
assassin = "code_assassin.cli:app"
code-assassin = "code_assassin.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/code_assassin"]

[tool.ruff]
line-length = 100

[dependency-groups]
dev = [
    "tiktoken>=0.14.0",
]
